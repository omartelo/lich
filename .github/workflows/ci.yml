name: ci

# Per-PR gate: format/vet + both suites on linux, with pass/fail counts and
# coverage rendered into the job summary, plus the backend suite on windows and
# macOS in parallel (os-tests below).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # dist must exist before any Go step: the backend go:embeds frontend/dist,
      # so it will not even compile without it. build also runs tsc (typecheck).
      - name: Frontend install + build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # biome is the frontend's gofmt + vet: formatting and lint in one pass.
      # Warnings (the a11y backlog) are reported without failing; errors fail.
      - name: Frontend format + lint
        working-directory: frontend
        run: pnpm check

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt: these files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Per-PR CI runs on Linux only; the Windows and macOS suites run at release
      # time. Compile every OS's build here so a broken build tag — a _test.go
      # that falls into the wrong OS's build, an OS-only file that stops
      # compiling — fails the PR instead of a release tag. vet builds the
      # _test.go files too, so it catches test-only tag mistakes `go build` misses.
      - name: Cross-compile all targets
        run: |
          for os in linux darwin windows; do
            echo "== $os =="
            CGO_ENABLED=0 GOOS=$os go build ./...
            CGO_ENABLED=0 GOOS=$os go vet ./...
          done

      - name: Frontend tests
        run: bash .github/scripts/web-test-summary.sh

      - name: Backend tests
        run: bash .github/scripts/go-test-summary.sh linux

  # The window (shell/, Rust on CEF): format, lint and the crate's suite.
  # Linking needs the CEF distribution, so this carries the same download cache
  # the release build does; --release shares one CEF wrapper build between
  # clippy and the tests.
  shell:
    runs-on: ubuntu-latest
    env:
      CEF_PATH: ${{ github.workspace }}/.cef
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install window build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libgtk-3-dev libnss3-dev libnspr4-dev \
            libasound2-dev libcups2-dev libdrm-dev libgbm-dev \
            libxcomposite-dev libxdamage-dev libxfixes-dev libxrandr-dev \
            libxkbcommon-dev libxss-dev libxtst-dev libwayland-dev

      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: .cef
          key: cef-linux-${{ hashFiles('shell/Cargo.lock') }}

      # shared-key: a release runs on a tag, and a tag can only read caches
      # made on its own ref or on main — this job on main is what makes them.
      # The default key is per job, and the release job would never see it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell
          shared-key: shell

      - name: Format
        working-directory: shell
        run: cargo fmt --check

      - name: Clippy
        working-directory: shell
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Tests
        working-directory: shell
        run: cargo test --release

  # The backend suite on the OSes the linux job cannot speak for. The
  # cross-compile step above proves every target still builds; only a real runner
  # proves it still passes — v0.18.0 shipped a path guard that read a rooted path
  # as relative on Windows, and the tag's release build was the first thing to
  # say so.
  #
  # On every PR and every merge, because opting in never worked: it asked the
  # author to know which code reads a per-OS location, and the one who did not
  # left main red for four merges (#220 → #224). It costs about ten seconds —
  # this runs beside the linux job, which takes longer than either of these — and
  # the runners are free on a public repository.
  os-tests:
    strategy:
      # One red OS still reports the other, rather than cancelling it.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # git-bash on Windows keeps these steps byte-identical to the linux job's.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # dist must exist before the Go suite (go:embed), same as the linux job.
      # The frontend suite is OS-independent and already ran there.
      - name: Frontend install + build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Backend tests
        run: bash .github/scripts/go-test-summary.sh ${{ matrix.os }}
