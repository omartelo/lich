name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # linux and windows build in parallel; release fans in and publishes.
  linux:
    runs-on: ubuntu-latest
    env:
      # cef-rs downloads the CEF distribution into CEF_PATH at build time
      # (~200 MB); the cache step below keeps it between runs.
      CEF_PATH: ${{ github.workspace }}/.cef
    steps:
      - uses: actions/checkout@v7
        with:
          # git describe needs the tag history for the package version.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The window is a Rust crate on CEF (shell/); the Go binary itself stays
      # pure Go (CGO_ENABLED=0). The toolchain, CEF's build dependencies and the
      # caches — restored from what ci.yml's shell job saves on main, the only
      # caches a tag can read — are the composite action's.
      - uses: ./.github/actions/shell-toolchain

      # Packaging needs task and nfpm.
      #
      # GOTOOLCHAIN=auto only here: setup-go exports `local`, which is right for
      # building lich (it holds every go command to the go.mod line) but breaks
      # installing these tools, since `@latest` resolves to releases that ask for
      # a newer Go than we declare. Scoped to the step because setup-go writes
      # `local` through GITHUB_ENV, which outranks a workflow-level env.
      - name: Install task and nfpm
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Frontend first: the backend embeds frontend/dist (go:embed), so Go
      # tests only compile once the frontend has been built.
      - name: Frontend install + build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # Both suites emit pass/fail counts + coverage into the job summary and
      # still fail the job on a red test (shared with ci.yml).
      - name: Frontend tests
        run: bash .github/scripts/web-test-summary.sh

      - name: Backend tests
        run: bash .github/scripts/go-test-summary.sh linux

      - name: Build Linux packages
        run: task package

      - name: Assemble Linux assets
        run: |
          cd bin
          # workflow_dispatch runs land here with a branch name; slashes would
          # break the file names.
          tag="${GITHUB_REF_NAME//\//-}"
          mv "lich.deb"             "lich-${tag}-amd64.deb"
          mv "lich.rpm"             "lich-${tag}-x86_64.rpm"
          mv "lich.pkg.tar.zst"     "lich-${tag}-x86_64.pkg.tar.zst"
          cp lich "lich-${tag}-linux-amd64"
          # The window for the bare binary and the AUR package: the PKGBUILD
          # unpacks it into /usr/lib/lich/shell. zstd's default level leaves
          # ~30 MB on the table for a minute of CPU; the env is how tar's zstd
          # takes a level. Threads spelled out: unlike -T0, ZSTD_NBTHREADS=0
          # is one thread, and level 19 on one thread is three minutes.
          ZSTD_CLEVEL=19 ZSTD_NBTHREADS="$(nproc)" tar --zstd -cf "lich-${tag}-linux-amd64-shell.tar.zst" shell
          ls -la lich-${tag}-*

      - name: Upload Linux assets
        uses: actions/upload-artifact@v7
        with:
          name: lich-linux
          path: bin/lich-*

  windows:
    runs-on: windows-latest
    defaults:
      run:
        # bash (git-bash) keeps the steps byte-identical to the linux job's.
        shell: bash
    env:
      # The window's CEF distribution, as in the linux job.
      CEF_PATH: ${{ github.workspace }}/.cef
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The window's toolchain and caches; see the linux job.
      - uses: ./.github/actions/shell-toolchain

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # GOTOOLCHAIN=auto for the tool install only — see the linux job.
      - name: Install task and Inno Setup
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          choco install innosetup -y --no-progress

      # package:windows chains the whole build (frontend install+build, exe,
      # installer) — and the frontend build is what go:embed needs before the
      # backend suite can even compile, hence build first, tests right after.
      # Frontend tests already gate the linux job; running them twice buys
      # nothing.
      - name: Build Windows binary + installer
        run: task package:windows

      - name: Backend tests (windows)
        run: bash .github/scripts/go-test-summary.sh windows

      # End to end on the runner before the assets ship: the installer installs
      # silently, lich.exe finds the window beside itself and opens it, the page
      # it serves loads (read over CDP: alive alone is not proof, a crash keeps
      # a process around while its dump is written), the window closes on a
      # plain close request, which is what the restart flow sends, and lich
      # exits with it. Its config lives under an APPDATA of its own.
      - name: Install and run lich end to end
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          bin/lich-setup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG="$RUNNER_TEMP/setup.log"
          app="$LOCALAPPDATA/Programs/lich"
          test -f "$app/lich.exe" && test -f "$app/shell/lich-shell.exe" && test -f "$app/shell/libcef.dll"
          # The C runtime is static: a machine without the Visual C++
          # redistributable must open the window too.
          dumpbin /DEPENDENTS "$app/shell/lich-shell.exe" > "$RUNNER_TEMP/deps.txt"
          if grep -qi 'VCRUNTIME\|MSVCP' "$RUNNER_TEMP/deps.txt"; then
            echo "::error::lich-shell.exe depends on the Visual C++ runtime"; cat "$RUNNER_TEMP/deps.txt"; exit 1
          fi
          # GUI subsystem, not console: a console-subsystem window gets its own
          # console window allocated (lich.exe is -H=windowsgui and has none to
          # lend), and closing that console kills the window. Invisible to the
          # run below, which inherits this shell's console.
          dumpbin /HEADERS "$app/shell/lich-shell.exe" > "$RUNNER_TEMP/headers.txt"
          grep -q 'subsystem (Windows GUI)' "$RUNNER_TEMP/headers.txt" || {
            echo "::error::lich-shell.exe is not a GUI-subsystem binary; it will pop a console window"
            grep -i subsystem "$RUNNER_TEMP/headers.txt"; exit 1
          }
          export APPDATA="$RUNNER_TEMP/appdata" LICH_LISTEN_PORT=47899
          mkdir -p "$APPDATA"
          "$app/lich.exe" -- --remote-debugging-port=9334 &
          for _ in $(seq 1 30); do
            sleep 1
            token=$(jq -r .token "$APPDATA/lich/runtime.json" 2>/dev/null) && break
          done
          test -n "$token" || { echo "::error::lich never wrote runtime.json"; cat "$APPDATA/lich/lich.log"; exit 1; }
          grep -q 'the bundled window' "$APPDATA/lich/lich.log" || { echo "::error::lich did not resolve its own window"; cat "$APPDATA/lich/lich.log"; exit 1; }
          for _ in $(seq 1 30); do
            sleep 1
            curl -sf http://127.0.0.1:9334/json > "$RUNNER_TEMP/pages.json" 2>/dev/null && grep -q '"title": *"lich"' "$RUNNER_TEMP/pages.json" && break
          done
          grep -q '"title": *"lich"' "$RUNNER_TEMP/pages.json" || { echo "::error::the window never loaded lich's page"; cat "$APPDATA/lich/lich.log"; exit 1; }
          sleep 10
          tasklist | grep -q lich-shell.exe || { echo "::error::the window died"; cat "$APPDATA/lich/lich.log"; exit 1; }
          # A second launch: lich finds the first on its port and hands the
          # window its URL, which CEF forwards to the running browser. The
          # forward used to open a second browser in it, a page more on CDP
          # and a process that outlived the window's close (#470); the window
          # now raises itself and the page count stays at one.
          "$app/lich.exe" || { echo "::error::the duplicate launch exited $?"; cat "$APPDATA/lich/lich.log"; exit 1; }
          sleep 5
          curl -sf http://127.0.0.1:9334/json > "$RUNNER_TEMP/pages.json"
          pages=$(grep -c '"type": *"page"' "$RUNNER_TEMP/pages.json" || true)
          [ "$pages" = 1 ] || { echo "::error::the forwarded launch left $pages pages in the window, expected one"; cat "$RUNNER_TEMP/pages.json"; cat "$APPDATA/lich/lich.log"; exit 1; }
          # A close request, not a kill: the same WM_CLOSE the restart flow posts.
          taskkill /IM lich-shell.exe > /dev/null
          for _ in $(seq 1 15); do sleep 1; tasklist | grep -q '^lich.exe' || break; done
          if tasklist | grep -q '^lich.exe'; then
            echo "::error::lich.exe is still running after its window closed"; cat "$APPDATA/lich/lich.log"; exit 1
          fi
          grep -q 'window closed, exiting' "$APPDATA/lich/lich.log" || { echo "::error::lich did not log the window closing"; cat "$APPDATA/lich/lich.log"; exit 1; }
          cat "$RUNNER_TEMP/pages.json"

      - name: Assemble Windows assets
        run: |
          cd bin
          tag="${GITHUB_REF_NAME//\//-}"
          mv lich.exe       "lich-${tag}-windows-amd64.exe"
          mv lich-setup.exe "lich-${tag}-windows-amd64-setup.exe"
          # The window for the portable exe: unzipped beside it as shell\.
          7z a -bso0 -bsp0 "lich-${tag}-windows-amd64-shell.zip" shell
          ls -la lich-${tag}-*

      - name: Upload Windows assets
        uses: actions/upload-artifact@v7
        with:
          name: lich-windows
          path: bin/lich-*

  mac:
    runs-on: macos-latest
    env:
      CEF_PATH: ${{ github.workspace }}/.cef
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The window's toolchain and caches; see the linux job.
      - uses: ./.github/actions/shell-toolchain

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # GOTOOLCHAIN=auto for the tool install only — see the linux job.
      - name: Install task
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # dist must exist before the backend suite (go:embed). macOS is Unix, so
      # this runs the real PTY tests on Apple Silicon; frontend tests already
      # gate the linux job.
      - name: Frontend install + build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Backend tests (macos)
        run: bash .github/scripts/go-test-summary.sh macos

      - name: Build macOS binaries
        run: task build:mac

      # The window, for the runner's own architecture: Apple Silicon. The
      # Intel bundle ships without one and opens a system browser.
      - name: Build the window (arm64)
        run: task build:shell

      # Two assets per arch: the .app the cask installs, and the bare binary the
      # in-app self-update and hand installs still download.
      - name: Assemble macOS assets
        run: |
          cd bin
          tag="${GITHUB_REF_NAME//\//-}"
          ../build/darwin/bundle.sh lich-darwin-arm64 "${tag#v}" stage-arm64 shell
          ../build/darwin/bundle.sh lich-darwin-amd64 "${tag#v}" stage-amd64
          for arch in arm64 amd64; do
            # ditto, not zip: it is the archiver that keeps a bundle's symlinks,
            # permissions and signature intact for Homebrew Cask to unpack.
            ditto -c -k --keepParent "stage-${arch}/Lich.app" "lich-${tag}-darwin-${arch}.zip"
            mv "lich-darwin-${arch}" "lich-${tag}-darwin-${arch}"
          done
          ls -la lich-${tag}-*

      # End to end on the runner before the assets ship; the script says what
      # it proves.
      - name: Run Lich.app end to end
        run: bash .github/scripts/mac-e2e.sh bin/stage-arm64/Lich.app

      - name: Upload end-to-end diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lich-macos-e2e
          path: ${{ runner.temp }}/diag
          if-no-files-found: ignore

      - name: Upload macOS assets
        uses: actions/upload-artifact@v7
        with:
          name: lich-macos
          path: bin/lich-*

  release:
    needs: [linux, windows, mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Checkout for CHANGELOG.md — the notes come from it — and to prove the
      # banner is still where the notes are about to point at it.
      - uses: actions/checkout@v7

      - name: Download build assets
        uses: actions/download-artifact@v8
        with:
          path: bin
          merge-multiple: true

      - name: Checksums
        run: |
          cd bin
          sha256sum lich-* > checksums.txt
          cat checksums.txt

      # Rendered here rather than in a job of its own like the cask: the
      # checksums are already in hand, and the manifest ships in the same
      # `gh release create` as the assets it hashes, so a release never exists
      # without it. The install URL is releases/latest/download/lich.json, so
      # nothing on a branch has to move for Scoop to see a new tag.
      - name: Render Scoop manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          sum() {
            awk -v file="$1" '$2 == file { print $1 }' bin/checksums.txt
          }
          exe="$(sum "lich-v${version}-windows-amd64.exe")"
          shell="$(sum "lich-v${version}-windows-amd64-shell.zip")"
          # An empty hash would publish a manifest that fails every install.
          if [ -z "$exe" ] || [ -z "$shell" ]; then
            echo "missing windows checksums in checksums.txt" >&2
            cat bin/checksums.txt >&2
            exit 1
          fi
          sed -e "s/@VERSION@/${version}/g" \
              -e "s/@SHA_EXE@/${exe}/" \
              -e "s/@SHA_SHELL@/${shell}/" \
              build/windows/scoop/lich.json.tpl > bin/lich.json
          jq . bin/lich.json

      # The notes open with the same banner the site and the social cards use.
      # It is addressed at this tag's tree, not at a branch, so a release keeps
      # the banner it shipped with however the file changes later.
      - name: Compose release notes
        env:
          BANNER: docs/media/og.png
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > body.md
          if [ ! -s body.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > body.md
          fi
          # A moved or renamed banner would otherwise put a broken image at the
          # top of this release and of every one after it, with nothing to
          # notice it but a reader.
          if [ ! -f "$BANNER" ]; then
            echo "banner not found at $BANNER" >&2
            exit 1
          fi
          {
            printf '<img src="https://raw.githubusercontent.com/%s/%s/%s" alt="lich — a terminal-first harness for coding with AI agents" width="900" />\n\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$BANNER"
            cat body.md
          } > notes.md
          cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            bin/lich-* bin/checksums.txt bin/lich.json \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md

  # The AUR PKGBUILD sources point at the GitHub Release assets, so this runs
  # only after `release` publishes them. updpkgsums fills the checksums by
  # downloading those assets; the action then regenerates .SRCINFO and pushes
  # to the lich-bin AUR repo over SSH.
  aur:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render PKGBUILD
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/@VERSION@/${version}/" build/linux/aur/PKGBUILD.tpl > PKGBUILD

      - name: Publish lich-bin to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: lich-bin
          pkgbuild: ./PKGBUILD
          assets: build/linux/aur/lich-bin.install
          updpkgsums: true
          # updpkgsums downloads the sources into the AUR checkout, and passing
          # `assets` switches the action from `git add PKGBUILD .SRCINFO` to
          # `git add --all` — which commits the 20MB binary (and now the 100MB
          # window) and trips the AUR's 488.28KiB blob limit. post_process runs
          # after .SRCINFO, before the commit.
          post_process: rm -f lich-v*-linux-amd64 lich-v*-linux-amd64-shell.tar.zst lich-*.desktop lich-*.png
          commit_username: omartelo
          commit_email: meopedevts@proton.me
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"

  # The cask pins the macOS assets by checksum, so it can only be rendered
  # once `release` has published them and their checksums.txt.
  # HOMEBREW_TAP_SSH_KEY is a deploy key with write access on
  # omartelo/homebrew-tap — GITHUB_TOKEN is scoped to this repository and cannot
  # push to another one. A deploy key, unlike a PAT, reaches exactly that one
  # repository and never expires, so a release years from now still publishes.
  homebrew:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --pattern checksums.txt
          sum() {
            awk -v file="$1" '$2 == file { print $1 }' checksums.txt
          }
          arm64="$(sum "lich-v${version}-darwin-arm64.zip")"
          amd64="$(sum "lich-v${version}-darwin-amd64.zip")"
          # An empty checksum would publish a cask that fails every install.
          if [ -z "$arm64" ] || [ -z "$amd64" ]; then
            echo "missing darwin checksums in checksums.txt" >&2
            cat checksums.txt >&2
            exit 1
          fi
          sed -e "s/@VERSION@/${version}/g" \
              -e "s/@SHA_ARM64@/${arm64}/" \
              -e "s/@SHA_AMD64@/${amd64}/" \
              build/darwin/homebrew/lich.rb.tpl > lich.rb
          cat lich.rb

      - name: Publish lich to the tap
        env:
          SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: |
          key="$(mktemp)"
          printf '%s\n' "$SSH_KEY" > "$key"
          chmod 600 "$key"
          known="$(mktemp)"
          ssh-keyscan -t ed25519 github.com > "$known" 2>/dev/null
          # IdentitiesOnly keeps ssh from offering the runner's other keys first
          # and getting rejected before this one is tried.
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$known"
          git clone --depth 1 git@github.com:omartelo/homebrew-tap.git tap
          mkdir -p tap/Casks
          cp lich.rb tap/Casks/lich.rb
          cd tap
          git config user.name omartelo
          git config user.email meopedevts@proton.me
          # The formula shipped a bare CLI and the cask supersedes it; leaving
          # both in the tap makes `brew install omartelo/tap/lich` ambiguous.
          git rm -q --ignore-unmatch Formula/lich.rb
          git add Casks/lich.rb
          # A re-run of the same tag renders an identical cask; nothing to push.
          if git diff --cached --quiet; then
            echo "cask already up to date"
            exit 0
          fi
          git commit -m "lich: update to ${GITHUB_REF_NAME}"
          git push
