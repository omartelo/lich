version: '3'

# lich is a pure-Go binary (no CGO) serving its embedded frontend to a Chromium
# --app window — see docs/chromium-shell.md. On Linux that window is lich's
# own, an embedded Chromium built out of shell/ (Rust, CEF) and launched like a
# browser; Windows and macOS still open the system browser. Linux first; an
# experimental Windows build cross-compiles via build:windows.

vars:
  APP_NAME: "lich"
  BIN_DIR: "bin"
  VITE_PORT: '{{.LICH_VITE_PORT | default 9245}}'
  # Package version follows the git tag (env VERSION overrides) — no manual bump.
  # The tag is trimmed in the template, not with sed: Task's shell is mvdan/sh
  # on every OS, and a plain Windows box has no sed on PATH — the pipeline would
  # fail silently and stamp an empty version into the binary.
  RAW_VERSION:
    sh: echo "${VERSION:-$(git describe --tags --always 2>/dev/null)}"
  VERSION: '{{trimPrefix "v" .RAW_VERSION}}'
  # -X main.version stamps the git tag into the binary so the in-app update
  # check knows what it is running (dev builds via `go run` stay "dev").
  LDFLAGS: '-s -w -X main.version={{.VERSION}}'
  GO_BUILD_FLAGS: '-trimpath -ldflags "{{.LDFLAGS}}"'

tasks:
  build:frontend:
    desc: Build frontend/dist (embedded by the Go binary)
    cmds:
      - cmd: cd frontend && pnpm install --frozen-lockfile && pnpm run build

  build:shell:
    desc: Build the Linux window (embedded Chromium) into bin/shell/
    platforms: [linux]
    cmds:
      # The Go binary stays pure and static; the window is a separate Rust
      # binary on CEF, found beside it at run time (internal/chromium/shell.go).
      # assemble.sh strips libcef.so and keeps only the runtime files lich
      # needs — the 1.3 GB cargo leaves in target/ becomes ~300 MB.
      - cmd: cd shell && cargo build --release
      - cmd: build/linux/shell/assemble.sh shell/target/release {{.BIN_DIR}}/shell

  build:
    desc: Build the static binary into bin/ (with the window on Linux)
    deps: [build:frontend, build:shell]
    cmds:
      # {{exeExt}}: `go build -o bin/lich` writes exactly that name — no .exe —
      # and Windows then refuses to exec it (PATHEXT resolution needs the
      # extension), so `task run` fails on the binary `task build` just made.
      - cmd: CGO_ENABLED=0 go build {{.GO_BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}{{exeExt}} .

  icons:windows:
    desc: Regenerate rsrc_windows_amd64.syso from build/windows/lich.ico
    cmds:
      # The .syso is the resource the Windows executable links, and it is the
      # only source of the exe's icon: the Start Menu shortcut and the native
      # file picker (an in-process COM dialog) both draw it. Nothing rebuilds
      # it automatically, so a new lich.ico that skips this task ships an
      # executable still wearing the previous mark.
      - cmd: go run github.com/akavel/rsrc@v0.10.2 -ico build/windows/lich.ico -arch amd64 -o rsrc_windows_amd64.syso

  build:windows:
    desc: Cross-compile the Windows binary (experimental)
    deps: [build:frontend]
    cmds:
      # GUI subsystem: no console window rides along. stdout/stderr go
      # nowhere — the persistent lich.log is the diagnostic surface.
      - cmd: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "{{.LDFLAGS}} -H=windowsgui" -o {{.BIN_DIR}}/{{.APP_NAME}}.exe .

  build:mac:
    desc: Cross-compile the macOS binaries (experimental)
    deps: [build:frontend]
    cmds:
      # Both arches: Apple Silicon (arm64) and Intel (amd64). Pure Go, so both
      # cross-compile from any host. Unsigned — Gatekeeper quarantines until
      # notarization ships (INSTALL.md says what a user has to do about it).
      - cmd: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build {{.GO_BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}-darwin-arm64 .
      - cmd: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build {{.GO_BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}-darwin-amd64 .

  bundle:mac:
    desc: Wrap the macOS binary in bin/Lich.app (macOS host only)
    deps: [build:mac]
    cmds:
      # The binary cross-compiles from anywhere; the bundle needs Apple's sips
      # and iconutil for the icon, so this task only runs on a Mac.
      - cmd: build/darwin/bundle.sh {{.BIN_DIR}}/{{.APP_NAME}}-darwin-{{ARCH}} {{.VERSION}} {{.BIN_DIR}}

  run:
    desc: Build and run
    deps: [build]
    cmds:
      - cmd: ./{{.BIN_DIR}}/{{.APP_NAME}}{{exeExt}}

  dev:
    desc: Dev mode — Vite HMR, isolated DB, port and Chromium profile
    deps: [build:shell]
    cmds:
      # frontend/dist must exist for go:embed to compile, even though the
      # window loads the Vite server; build it once, then serve with HMR.
      # Dev isolation: separate DB (LICH_DEV, store.databasePath), separate
      # listener port and Chromium profile (LICH_DEV_URL side effect), so a
      # daily-driver lich keeps running untouched.
      - cmd: |
          set -e
          (cd frontend && pnpm install --frozen-lockfile && pnpm run build)
          # Ctrl+C reaches the whole process group and takes Vite with it;
          # closing the window instead leaves it running (Task's shell has no
          # kill and its `$!` is not a pid) — vite's strictPort then says so.
          (cd frontend && pnpm run dev) &
          # node, not `sleep`: Task interprets every command with its own shell
          # (mvdan/sh) on every OS, where sleep is no builtin — a plain Windows
          # box has no such binary on PATH and `task dev` dies right here. node
          # is already required by the pnpm line above.
          node -e "setTimeout(() => {}, 1500)"
          # go run leaves the binary in a temp dir, where the bundled-window
          # lookup finds nothing; the pin names the window build:shell made.
          # Empty off Linux, where the system browser still answers.
          LICH_DEV=1 LICH_DEV_URL="http://127.0.0.1:{{.VITE_PORT}}" LICH_LISTEN_PORT=47822 LICH_BROWSER="{{if eq OS "linux"}}{{.ROOT_DIR}}/{{.BIN_DIR}}/shell/lich-shell{{end}}" go run .

  test:shell:
    desc: Run the window crate's suite (Linux)
    platforms: [linux]
    cmds:
      # --release shares cargo's CEF download and C++ wrapper build with
      # build:shell; a debug profile would fetch and build both again.
      - cmd: cd shell && cargo test --release

  test:
    desc: Run the backend, frontend and window suites
    cmds:
      - cmd: go test ./...
      - cmd: cd frontend && pnpm test
      - task: test:shell

  mutation:
    desc: Mutation tests via gremlins — .gremlins.yaml, scope with -- ./internal/pkg/
    preconditions:
      - sh: command -v gremlins
        msg: "gremlins is required: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest"
    cmds:
      # No path → whole module (slow: single-worker, terminal spawns real PTYs).
      # Scope a run with: task mutation -- ./internal/store/
      - cmd: gremlins unleash {{.CLI_ARGS}}

  package:
    desc: Build the Linux packages (deb, rpm, archlinux)
    deps: [build]
    cmds:
      - task: package:nfpm
        vars: { FORMAT: deb, TARGET: '{{.APP_NAME}}.deb' }
      - task: package:nfpm
        vars: { FORMAT: rpm, TARGET: '{{.APP_NAME}}.rpm' }
      - task: package:nfpm
        vars: { FORMAT: archlinux, TARGET: '{{.APP_NAME}}.pkg.tar.zst' }

  package:windows:
    desc: Build bin/lich-setup.exe (needs Inno Setup 6)
    deps: [build:windows]
    preconditions:
      - sh: command -v iscc
        msg: "iscc (Inno Setup 6) is required — on Windows: choco install innosetup"
    env:
      VERSION: '{{.VERSION}}'
    cmds:
      - cmd: iscc build/windows/lich.iss

  package:nfpm:
    internal: true
    preconditions:
      - sh: command -v nfpm
        msg: "nfpm is required: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest"
    env:
      VERSION: '{{.VERSION}}'
      GOARCH: amd64
    cmds:
      - cmd: nfpm package -f build/linux/nfpm/nfpm.yaml -p {{.FORMAT}} -t {{.BIN_DIR}}/{{.TARGET}}
