# nfpm config for the lich packages (deb, rpm, archlinux) — invoked directly
# by the root Taskfile (`task package`). The binary is static pure Go and the
# window (lich's own Chromium, bin/shell) ships beside it; the only runtime
# needs left are zenity and git, both soft (recommends where the format
# supports it) so installs never block.

name: "lich"
arch: ${GOARCH}
platform: "linux"
# Follows the git tag via $VERSION (injected by the Taskfile) — no manual bump.
version: "${VERSION}"
section: "default"
priority: "extra"
maintainer: "omartelo <meopedevts@proton.me>"
description: "A terminal-first harness for coding with AI agents"
vendor: "lich"
homepage: "https://github.com/omartelo/lich"
license: "AGPL-3.0-only"

contents:
  - src: "./bin/lich"
    dst: "/usr/local/bin/lich"
  # The window, where /usr/local/bin/lich looks for it: the lib directory
  # sibling to its bin (internal/chromium/shell.go).
  - src: "./bin/shell"
    dst: "/usr/local/lib/lich/shell"
    type: tree
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/lich.png"
  - src: "./build/linux/lich.desktop"
    dst: "/usr/share/applications/lich.desktop"

# gh is deliberately absent: it is optional (pull requests only) and packaged
# under a different name on each distribution, so a recommends here would name
# the wrong package as often as the right one. INSTALL.md and the app both
# point at cli.github.com instead.
recommends:
  - zenity
  - git

# xz rather than the gzip default: ~30 MB less per package for the 480 MB
# window, and unlike zstd every dpkg and rpm still in use unpacks it.
deb:
  compression: xz
rpm:
  compression: xz

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
