[package]
name = "lich-shell"
version = "0.0.0"
edition = "2024"
publish = false
description = "lich's window: an embedded Chromium (CEF) launched by the Go backend"
license = "AGPL-3.0-only"

[dependencies]
# The fork's `lich-hooks` branch: upstream's `native-tongue/capabilities`
# (ba69cfd, the decision hooks: keys, Chromium's commands, new windows,
# navigation, downloads, permissions, the context menu) plus the page-first
# key decision (kurogane#21), window_class / window_title / window_icon /
# cache_dir (kurogane#11) and the main window's geometry handed to the
# delegate (kurogane#19); move back to 0x48piraj/kurogane once they land
# (build/linux/shell/README.md). CEF comes through it (kurogane::cef): a
# dependency of our own would turn cef's default features back on for the
# whole build.
kurogane = { git = "https://github.com/omartelo/kurogane", rev = "0a2852152c15b9bfeb12ae0b13badf802046d2cf" }

# Whether this machine can confine Chromium's subprocesses is asked the way
# Chromium asks it (main.rs): a fork that tries a user namespace.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# The taskbar groups windows by AppUserModelID (main.rs); nothing else of the
# Win32 API is used.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

# The executable's icon, version block and manifest (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
