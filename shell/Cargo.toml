[package]
name = "lich-shell"
version = "0.0.0"
edition = "2024"
publish = false
description = "lich's window: an embedded Chromium (CEF) launched by the Go backend"
license = "AGPL-3.0-only"

[dependencies]
# The fork's `lich-master` branch: upstream master (a26964d, the decision
# hooks, WindowOptions, profile_dir and CEF 154 loaded at run time through
# tetsu) plus Chromium's status bubble kept off the window (kurogane#23) and,
# on the `lich-close-prompt` branch, App::on_before_unload, which keeps a close
# the user made for the page to ask about; move back to 0x48piraj/kurogane once
# they land (build/linux/shell/README.md).
kurogane = { git = "https://github.com/omartelo/kurogane", rev = "be7fba11b065863c344a6f2cb439259d9308373a" }

# Whether this machine can confine Chromium's subprocesses is asked the way
# Chromium asks it (main.rs): a fork that tries a user namespace.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# The taskbar groups windows by AppUserModelID (main.rs); nothing else of the
# Win32 API is used.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

# The executable's icon, version block and manifest (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
