[package]
name = "lich-shell"
version = "0.0.0"
edition = "2024"
publish = false
description = "lich's window: an embedded Chromium (CEF) launched by the Go backend"
license = "AGPL-3.0-only"

[dependencies]
# The fork's `lich` branch: upstream eedaedc plus window_class / window_title /
# window_icon / cache_dir (kurogane#11) and the macOS bundle's Contents/Frameworks
# lookup (kurogane#13); move back to 0x48piraj/kurogane once both land
# (build/linux/shell/README.md).
kurogane = { git = "https://github.com/omartelo/kurogane", rev = "cd1ef1d2756154ec84cd9ccc5bf3edc7a9ba162e" }

# The taskbar groups windows by AppUserModelID (main.rs); nothing else of the
# Win32 API is used.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

# The executable's icon, version block and manifest (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
