[package]
name = "lich-shell"
version = "0.0.0"
edition = "2024"
publish = false
description = "lich's window: an embedded Chromium (CEF) launched by the Go backend"
license = "AGPL-3.0-only"

[dependencies]
# A fork carrying window_class / window_title / window_icon / cache_dir on top
# of upstream eedaedc, submitted upstream as a PR; move back to
# 0x48piraj/kurogane once it lands (build/linux/shell/README.md).
kurogane = { git = "https://github.com/omartelo/kurogane", rev = "9bb9a6ae4e6224b18a9c0d65a046136648d854ab" }

# The taskbar groups windows by AppUserModelID (main.rs); nothing else of the
# Win32 API is used.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

# The executable's icon, version block and manifest (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
